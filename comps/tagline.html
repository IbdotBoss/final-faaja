<style>
:root {
  --ground: #1b1d20; --lane: #222428; --line: #f3f1ea; --ink: #f3f1ea; --ink-2: #c3c0b7; --rule: #45484e;
  --gold: #ebc66b; --focus: #ebc66b;
  --font: "Anybody", system-ui, sans-serif;
  --t-s: .9375rem; --t-m: 1.0625rem; --t-l: 1.375rem; --t-date: 1.75rem; --t-num: 2.5rem;
  --lane-w: 3px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 var(--t-m)/1.5 var(--font); font-stretch: 92%; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 40px 16px 32px; }
@media (min-width: 900px) { .wrap { padding: 64px 32px 40px; } }

h1 {
  margin: 0; font-size: clamp(2rem, 9.2vw, 7.5rem); line-height: .95; font-weight: 900; font-stretch: 125%;
  letter-spacing: -.01em; white-space: nowrap; min-width: 0;
  cursor: ew-resize; user-select: none; touch-action: pan-y;
}
.gloss { margin: 12px 0 0; max-width: 40ch; color: var(--ink-2); }
.gloss b { color: var(--ink); }

/* the string: grab it, let go, it springs back */
.string { display: block; width: 100%; height: 72px; margin: 16px 0 0; touch-action: pan-x; cursor: grab; overflow: visible; }
.string path { fill: none; stroke: var(--line); stroke-width: 2; vector-effect: non-scaling-stroke; }
.string circle { fill: var(--line); }
.string:active { cursor: grabbing; }

/* the folder: React Bits Folder, CSS as published in folder/src/Folder.css */
.folder-slot { display: grid; place-items: center; min-height: 200px; margin: 0 0 8px; padding-top: 72px; }
@media (min-width: 900px) { .folder-slot { min-height: 340px; padding-top: 104px; } }
.folder-root { --folder-focus: var(--focus); }
.ff-paper { height: 100%; padding: calc(12px * var(--folder-scale)) calc(10px * var(--folder-scale)); color: #2a2c30; font-family: var(--font); font-stretch: 100%; }
.ff-paper-title { display: block; margin-bottom: calc(6px * var(--folder-scale)); font-size: calc(11px * var(--folder-scale)); font-weight: 700; line-height: 1.2; }
.ff-paper ul { margin: 0; padding: 0 0 0 calc(10px * var(--folder-scale)); font-size: calc(8.5px * var(--folder-scale)); line-height: 1.35; color: #4a4c50; }
.fallback { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 24px; align-self: end; }
.fallback a { color: var(--ink); font-weight: 700; text-underline-offset: 4px; }
.fallback a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* the list: each module, its test date and the link, one tap */
.track { list-style: none; margin: 16px 0 0; padding: 0; border-top: var(--lane-w) solid var(--line); }
.lane { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; padding: 16px 0; border-bottom: var(--lane-w) solid var(--line); }
.num { grid-row: span 3; font-size: 2rem; line-height: 1.1; font-weight: 900; font-stretch: 150%; font-variant-numeric: tabular-nums; }
h2 { margin: 0; font-size: var(--t-l); line-height: 1.15; font-weight: 700; font-stretch: 100%; overflow-wrap: break-word; text-wrap: balance; }
.code { margin: 4px 0 0; font-size: var(--t-s); color: var(--ink-2); }
.when { margin: 0; }
.when time { font-size: var(--t-date); font-weight: 900; font-stretch: 125%; line-height: 1.1; white-space: nowrap; }
.left { color: var(--gold); font-weight: 700; font-size: var(--t-s); white-space: nowrap; }
.open { justify-self: start; color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.open:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
@media (hover: hover) { .open:hover { text-decoration-thickness: 2px; } }
@media (min-width: 900px) {
  .lane { grid-template-columns: 64px minmax(0, 1fr) 260px 220px; align-items: center; gap: 24px; padding: 20px 0; }
  .num { grid-row: auto; font-size: 2.5rem; }
}
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

footer { margin-top: 40px; font-size: var(--t-s); color: var(--ink-2); }
footer a { color: var(--ink); text-underline-offset: 3px; }
footer a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.gloss { font-size: 1.375rem; }
.jit { display: inline-block; animation: jit 3.2s infinite steps(1, end); }
@keyframes jit { 0%, 86%, 100% { transform: none; } 88% { transform: translate(1px, -1px) rotate(-1.5deg); } 90% { transform: translate(-1px, 1px) rotate(1deg); } 92% { transform: translate(1px, 0) rotate(-1deg); } 94% { transform: translate(-1px, 0); } }
@media (prefers-reduced-motion: reduce) { .jit { animation: none; } }
</style>
